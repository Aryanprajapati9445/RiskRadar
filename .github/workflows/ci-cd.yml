
name: RiskRadar Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: riskradar-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Inspect GitHub OIDC claims
      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString('utf8')
            );

            core.info(JSON.stringify({
              issuer: payload.iss,
              audience: payload.aud,
              subject: payload.sub,
              repository: payload.repository,
              repository_id: payload.repository_id,
              repository_owner: payload.repository_owner,
              repository_owner_id: payload.repository_owner_id,
              ref: payload.ref
            }, null, 2));

      # STEP 2: Configure AWS credentials using OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: RiskRadarGitHubDeployment

      # STEP 3: Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # STEP 4: Create deployment script
      - name: Create deployment script
        shell: bash
        run: |
          cat > deploy.sh <<'SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail

          APP_DIR="/home/ubuntu/apps/RiskRadar"
          BACKUP_ENV="/home/ubuntu/.riskradar.env"

          cd "$APP_DIR"

          echo "Backing up production environment..."

          if [ ! -f .env ]; then
            echo "ERROR: Production .env file is missing."
            exit 1
          fi

          cp -p .env "$BACKUP_ENV"

          echo "Fetching latest main branch..."

          git -c safe.directory="$APP_DIR" fetch origin main

          git -c safe.directory="$APP_DIR" reset --hard origin/main

          echo "Restoring production environment..."

          cp -p "$BACKUP_ENV" .env
          chmod 600 .env

          echo "Validating Docker Compose configuration..."

          docker compose config -q

          echo "Building and deploying RiskRadar..."

          docker compose up -d --build --no-deps app

          echo "Waiting for application health check..."

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/health; then
              echo
              echo "RiskRadar deployment successful."
              docker compose ps
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: RiskRadar health check failed."

          docker compose logs --tail=100 app

          exit 1
          SCRIPT

      # STEP 5: Send deployment command through SSM
      - name: Send deployment command through SSM
        id: deploy
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          jq -n \
            --arg instance "$INSTANCE_ID" \
            --rawfile script deploy.sh \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Parameters: {
                commands: [$script]
              },
              TimeoutSeconds: 600,
              Comment: "RiskRadar automatic deployment from GitHub Actions"
            }' > ssm-request.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-request.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "SSM command ID: $COMMAND_ID"

      # STEP 6: Wait for deployment result
      - name: Wait for deployment result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || \
                  "$STATUS" == "Cancelled" || \
                  "$STATUS" == "TimedOut" ]]; then

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1
            fi

            sleep 5
          done

          echo "Deployment did not finish within the expected time."
          exit 1
