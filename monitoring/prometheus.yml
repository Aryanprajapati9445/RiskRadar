# ========================================================
# Prometheus Scrape Configuration for Fraud Detection App
# ========================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'fraud_detection_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:5000']
        labels:
          application: 'fraud-detection-dashboard'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
