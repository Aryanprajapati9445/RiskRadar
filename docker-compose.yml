version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Flask Application Service (Fraud Detection Dashboard)
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_detection_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=fraud-secret-key-production-2026
      - DATABASE_URL=sqlite:////app/fraud_dashboard.db
      - PORT=5000
    volumes:
      - app_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - fraud_network

  # -------------------------------------------------------------
  # 2. Prometheus Monitoring Service
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: fraud_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - app
    networks:
      - fraud_network

  # -------------------------------------------------------------
  # 3. Grafana Analytics & Visualization Service
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: fraud_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - fraud_network

networks:
  fraud_network:
    driver: bridge

volumes:
  app_data:
