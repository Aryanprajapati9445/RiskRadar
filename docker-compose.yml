services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskradar
    restart: unless-stopped
    ports:
      - "0.0.0.0:${HOST_PORT:-5000}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be configured}
      DATABASE_URL: sqlite:////app/data/fraud_dashboard.db
      PORT: "5000"
    volumes:
      - app_data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: riskradar-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - app

  grafana:
    image: grafana/grafana:10.4.2
    container_name: riskradar-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Grafana password must be configured}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  app_data:
  prometheus_data:
  grafana_data: